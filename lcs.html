<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LCS — DepensesPro v5</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#F0F4F8;--sf:#FFF;--sf2:#EEF2F7;--bd:#D8DEE8;--bd2:#C2CAD8;
  --tx:#0F1928;--tx2:#3D4E63;--tx3:#8A98AA;
  --lcs:#2E8BC0;--lcs2:#1A6A9A;--lcsbg:#EAF4FB;--lcsbd:#A8D4EC;
  --bl:#1547C8;--blbg:#EAF0FC;--blbd:#B5C8F5;
  --gn:#166834;--gnbg:#E7F4ED;--gnbd:#A3D4B8;
  --rd:#B91C1C;--rdbg:#FEE9E9;--rdbd:#F5ADAD;
  --am:#92400E;--ambg:#FEF3C7;--ambd:#F0CC80;
  --pu:#5B21B6;--pubg:#F0EBFE;--pubd:#C4AAFA;
  --go:#78350F;--gobg:#FDF2E3;--gobd:#F4C97A;
  --ca:#0E7490;--cabg:#ECFEFF;--cabd:#A5F3FC;
  --or:#C2410C;--orbg:#FFF7ED;--orbd:#FDBA74;
  --arch:#374151;--archbg:#F9FAFB;--archbd:#D1D5DB;
  --sh:0 1px 4px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04);
  --sh2:0 4px 20px rgba(0,0,0,.10),0 12px 44px rgba(0,0,0,.07);
  --r:10px;--rl:14px;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6}
.shell{display:flex;height:100vh;overflow:hidden}
.sb{width:252px;background:#0A1628;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-hd{padding:14px 16px 12px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.sb-hd img{height:34px;width:auto;object-fit:contain}
.sb-nm{font-family:var(--fh);font-size:12px;font-weight:700;color:#fff;line-height:1.2}
.sb-sub{font-size:9px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}
.sb-usr{padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;position:relative}
.sb-usr:hover{background:rgba(255,255,255,.03)}
.urow{display:flex;align-items:center;gap:9px}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;font-family:var(--fh)}
.av-b{background:#1547C8;color:#fff}.av-g{background:#166834;color:#fff}.av-r{background:#B91C1C;color:#fff}.av-gold{background:#92400E;color:#fff}
.unm{font-size:11px;font-weight:600;color:#fff;line-height:1.2}.url{font-size:9px;color:rgba(255,255,255,.38);margin-top:1px}.uht{font-size:9px;color:rgba(255,255,255,.22);margin-top:2px}
.udd{display:none;position:absolute;top:calc(100% + 2px);left:7px;right:7px;background:#172234;border:1px solid rgba(255,255,255,.12);border-radius:9px;z-index:200;overflow:hidden}
.udd.op{display:block}
.udi{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)}
.udi:last-child{border-bottom:none}.udi:hover{background:rgba(255,255,255,.06)}
.udn{font-size:11px;font-weight:500;color:#fff}.udr{font-size:9px;color:rgba(255,255,255,.35)}
.chip{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.3px;text-transform:uppercase}
.chip-a{background:var(--gobg);color:var(--go)}.chip-c{background:var(--cabg);color:var(--ca)}.chip-d{background:var(--pubg);color:var(--pu)}
.sb-nav{padding:10px 7px;flex:1;display:flex;flex-direction:column;gap:1px}
.nlbl{font-size:8px;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:1.2px;padding:5px 9px 3px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;color:rgba(255,255,255,.45);font-size:11px;transition:all .12s}
.ni:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.ni.act{background:rgba(46,139,192,.25);color:#fff;font-weight:600;border-left:2px solid var(--lcs)}
.ni-ic{width:17px;text-align:center;font-size:12px;flex-shrink:0}
.nib{margin-left:auto;color:#fff;font-size:8px;font-weight:700;padding:1px 6px;border-radius:20px}
.nib-b{background:var(--lcs)}.nib-p{background:var(--pu)}.nib-r{background:var(--rd)}.nib-o{background:var(--or)}
.sb-ft{margin-top:auto;padding:10px 13px;border-top:1px solid rgba(255,255,255,.06)}
.sb-ft p{font-size:9px;color:rgba(255,255,255,.17);line-height:1.7}
.mn{flex:1;overflow-y:auto;background:var(--bg)}
.tb{background:var(--sf);border-bottom:1px solid var(--bd);padding:11px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.tb-l{display:flex;align-items:center;gap:11px}.tb-lg{height:26px;width:auto}.tb-sp{width:1px;height:26px;background:var(--bd)}
.tb-ti{font-family:var(--fh);font-size:17px;font-weight:700}.tb-su{font-size:10px;color:var(--tx3);margin-top:1px}
.tb-dt{font-size:10px;color:var(--tx3);background:var(--sf2);padding:4px 9px;border-radius:6px;border:1px solid var(--bd)}
.ct{padding:18px 22px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:16px 20px;box-shadow:var(--sh);margin-bottom:13px}
.cttl{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:11px}
.mg{display:grid;gap:11px;margin-bottom:14px}
.mg3{grid-template-columns:repeat(3,1fr)}.mg4{grid-template-columns:repeat(4,1fr)}.mg2{grid-template-columns:repeat(2,1fr)}.mg5{grid-template-columns:repeat(5,1fr)}
.mc{border-radius:var(--rl);padding:14px 16px;border:1px solid;box-shadow:var(--sh)}
.mc-b{background:var(--blbg);border-color:var(--blbd)}.mc-g{background:var(--gnbg);border-color:var(--gnbd)}.mc-r{background:var(--rdbg);border-color:var(--rdbd)}.mc-p{background:var(--pubg);border-color:var(--pubd)}.mc-c{background:var(--cabg);border-color:var(--cabd)}.mc-o{background:var(--orbg);border-color:var(--orbd)}
.mc-ico{font-size:18px;margin-bottom:7px}.mc-v{font-family:var(--fh);font-size:24px;font-weight:800;line-height:1}
.mc-lb{font-size:9px;font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}.mc-sb{font-size:10px;color:var(--tx3);margin-top:2px}
.cv-b{color:var(--bl)}.cv-g{color:var(--gn)}.cv-r{color:var(--rd)}.cv-p{color:var(--pu)}.cv-c{color:var(--ca)}.cv-o{color:var(--or)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid;font-family:var(--fh)}
.ba{background:var(--blbg);color:var(--bl);border-color:var(--blbd)}.bv{background:var(--gnbg);color:var(--gn);border-color:var(--gnbd)}.br{background:var(--rdbg);color:var(--rd);border-color:var(--rdbd)}.bb{background:var(--sf2);color:var(--tx2);border-color:var(--bd)}.bd{background:var(--pubg);color:var(--pu);border-color:var(--pubd)}.bc{background:var(--cabg);color:var(--ca);border-color:var(--cabd)}.bar{background:var(--archbg);color:var(--arch);border-color:var(--archbd)}.bo{background:var(--orbg);color:var(--or);border-color:var(--orbd)}.bdec{background:var(--cabg);color:var(--ca);border-color:var(--cabd)}
.elist{display:flex;flex-direction:column;gap:6px}
.erow{display:flex;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:9px 13px;box-shadow:var(--sh);cursor:pointer;transition:box-shadow .14s,transform .11s;border-left:4px solid transparent}
.erow:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.er-b{border-left-color:var(--bd2)}.er-a{border-left-color:var(--bl)}.er-v{border-left-color:var(--gn)}.er-r{border-left-color:var(--rd)}.er-d{border-left-color:var(--pu)}.er-dec{border-left-color:var(--ca)}.er-ar{border-left-color:var(--arch);opacity:.72}.er-o{border-left-color:var(--or)}
.eic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-right:9px;background:var(--sf2)}
.einf{flex:1;min-width:0}.eti{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eme{font-size:10px;color:var(--tx3);margin-top:1px}
.ert{display:flex;align-items:center;gap:5px;flex-shrink:0;margin-left:9px;flex-wrap:wrap;justify-content:flex-end}
.eam{font-family:var(--fh);font-size:13px;font-weight:700}
.btn{padding:6px 12px;border-radius:7px;border:1px solid var(--bd2);background:var(--sf);color:var(--tx);font-family:var(--fb);font-size:11px;font-weight:500;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--sf2)}
.btn-lcs{background:var(--lcs);color:#fff;border-color:var(--lcs)}.btn-lcs:hover{background:var(--lcs2)}
.btn-g{background:var(--gnbg);color:var(--gn);border-color:var(--gnbd);font-weight:600}.btn-g:hover{background:var(--gnbd)}
.btn-r{background:var(--rdbg);color:var(--rd);border-color:var(--rdbd);font-weight:600}.btn-r:hover{background:var(--rdbd)}
.btn-b{background:var(--blbg);color:var(--bl);border-color:var(--blbd)}.btn-b:hover{background:var(--blbd)}
.btn-p{background:var(--pubg);color:var(--pu);border-color:var(--pubd);font-weight:600}.btn-p:hover{background:var(--pubd)}
.btn-c{background:var(--cabg);color:var(--ca);border-color:var(--cabd);font-weight:600}.btn-c:hover{background:var(--cabd)}
.btn-pr{background:var(--gobg);color:var(--go);border-color:var(--gobd);font-weight:600}.btn-pr:hover{background:var(--gobd)}
.btn-del{background:var(--rdbg);color:var(--rd);border-color:var(--rdbd)}.btn-del:hover{background:var(--rdbd)}
.btn-ed{background:var(--blbg);color:var(--bl);border-color:var(--blbd)}.btn-ed:hover{background:var(--blbd)}
.btn-arch{background:var(--archbg);color:var(--arch);border-color:var(--archbd)}.btn-arch:hover{background:var(--archbd)}
.btn-o{background:var(--orbg);color:var(--or);border-color:var(--orbd);font-weight:600}.btn-o:hover{background:var(--orbd)}
.btn-sm{padding:3px 9px;font-size:10px;border-radius:5px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fgp{margin-bottom:11px}.flbl{font-size:10px;font-weight:700;color:var(--tx2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.5px}
.fi,.fs,.ft{width:100%;padding:7px 11px;border:1px solid var(--bd);border-radius:7px;background:var(--sf);color:var(--tx);font-family:var(--fb);font-size:12px;transition:border-color .12s;outline:none}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--lcs);box-shadow:0 0 0 3px rgba(46,139,192,.1)}
.ft{resize:vertical;min-height:65px;line-height:1.5}
.ov{display:none;position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.ov.op{display:flex}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:22px;width:530px;max-height:88vh;overflow-y:auto;box-shadow:var(--sh2);animation:mi .18s ease-out}
@keyframes mi{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.mhd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.mti{font-family:var(--fh);font-size:16px;font-weight:700}
.mcl{width:28px;height:28px;border-radius:50%;background:var(--sf2);border:none;cursor:pointer;font-size:13px;color:var(--tx2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mcl:hover{background:var(--bd)}.mft{display:flex;gap:7px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--bd)}
.dtbl{width:100%;font-size:11px;margin-bottom:11px}
.dtbl td{padding:3px 0;vertical-align:top}
.dtbl td:first-child{color:var(--tx3);width:110px;font-size:9px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding-top:5px}
.dam{font-family:var(--fh);font-size:26px;font-weight:800;margin:6px 0 12px}
.tl{display:flex;flex-direction:column}.tls{display:flex;gap:9px;padding-bottom:11px;position:relative}
.tls:not(:last-child)::before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:1px;background:var(--bd)}
.tld{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;border:2px solid;margin-top:1px}
.tl-ok{background:var(--gnbg);border-color:var(--gnbd);color:var(--gn)}.tl-w{background:var(--blbg);border-color:var(--blbd);color:var(--bl)}.tl-n{background:var(--sf2);border-color:var(--bd);color:var(--tx3)}.tl-ko{background:var(--rdbg);border-color:var(--rdbd);color:var(--rd)}.tl-o{background:var(--orbg);border-color:var(--orbd);color:var(--or)}
.tln{font-size:11px;font-weight:500}.tls2{font-size:10px;color:var(--tx3);margin-top:1px}
.cmt{background:var(--sf2);border-radius:7px;padding:8px 11px;margin-bottom:6px}
.cmt-a{font-size:11px;font-weight:600;color:var(--tx2)}.cmt-d{font-size:9px;color:var(--tx3);margin-left:4px}.cmt-t{font-size:11px;margin-top:2px}
.twp{position:fixed;top:14px;right:14px;z-index:2000;display:flex;flex-direction:column;gap:6px}
.tst{padding:9px 13px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid;box-shadow:var(--sh2);animation:ti .2s ease-out;max-width:290px}
@keyframes ti{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.tok{background:var(--gnbg);color:var(--gn);border-color:var(--gnbd)}.ter{background:var(--rdbg);color:var(--rd);border-color:var(--rdbd)}.tin{background:var(--cabg);color:var(--ca);border-color:var(--cabd)}.twa{background:var(--ambg);color:var(--am);border-color:var(--ambd)}
.dvd{border:none;border-top:1px solid var(--bd);margin:12px 0}
.shd{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.sti{font-family:var(--fh);font-size:14px;font-weight:700}
.emp{text-align:center;padding:36px 16px;color:var(--tx3)}.emp-i{font-size:32px;margin-bottom:7px}
.ib{background:var(--lcsbg);border:1px solid var(--lcsbd);border-radius:7px;padding:8px 11px;font-size:11px;color:var(--lcs2);margin-bottom:11px}
.rb{background:var(--rdbg);border:1px solid var(--rdbd);border-radius:7px;padding:9px 13px;font-size:11px;color:var(--rd);margin-bottom:11px}
.ob{background:var(--orbg);border:1px solid var(--orbd);border-radius:7px;padding:9px 13px;font-size:11px;color:var(--or);margin-bottom:11px}
.gb{background:var(--gnbg);border:1px solid var(--gnbd);border-radius:7px;padding:9px 13px;font-size:11px;color:var(--gn);margin-bottom:11px}
.fbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fs2{padding:5px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);font-size:11px;color:var(--tx);cursor:pointer;font-family:var(--fb);outline:none}
.rb2{padding:9px 13px;border-radius:8px;margin-bottom:13px;display:flex;align-items:center;gap:8px;border:1px solid;font-size:11px}
.rb-ad{background:var(--gobg);border-color:var(--gobd);color:var(--go)}.rb-db{background:var(--cabg);border-color:var(--cabd);color:var(--ca)}.rb-sb{background:var(--lcsbg);border-color:var(--lcsbd);color:var(--lcs2)}
.rb-ic{font-size:16px;flex-shrink:0}
.csb{background:linear-gradient(135deg,#0E7490,#1A6A9A);border-radius:13px;padding:18px 22px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden}
.csb::before{content:'💰';position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:42px;opacity:.18}
.csb-lb{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;opacity:.75}
.csb-v{font-family:var(--fh);font-size:32px;font-weight:800;margin:5px 0 2px;letter-spacing:-1px}
.csb-debit{background:linear-gradient(135deg,#7F1D1D,#B91C1C)!important}
.csb-alert{background:rgba(255,200,200,.25);border:1px solid rgba(255,150,150,.5);border-radius:6px;padding:6px 11px;font-size:11px;margin-top:8px}
.sit-table{width:100%;border-collapse:collapse;font-size:11px}
.sit-table th{background:#0A1628;color:#fff;padding:8px 11px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.6px;font-family:var(--fh)}
.sit-table th:not(:first-child):not(:nth-child(2)){text-align:right}
.sit-table td{padding:8px 11px;border-bottom:1px solid var(--bd);vertical-align:middle}
.sit-table tr:hover td{background:var(--sf2)}.sit-table .row-total{background:#F0F4F8;font-weight:700}.sit-table .row-neg{background:#FFF5F5}
.sit-table .cr{color:var(--gn);font-weight:700;text-align:right}.sit-table .db{color:var(--rd);font-weight:700;text-align:right}
.sit-table .sl-p{color:var(--gn);font-weight:700;font-family:var(--fh);text-align:right}
.sit-table .sl-n{color:var(--rd);font-weight:700;font-family:var(--fh);text-align:right;animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.week-block{margin-bottom:14px}
.week-hdr{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:8px 13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:5px}
.week-hdr:hover{background:var(--bd)}.week-ttl{font-family:var(--fh);font-size:11px;font-weight:700}
.week-stats{display:flex;gap:11px;font-size:10px}
.wc{color:var(--gn);font-weight:600}.wd{color:var(--rd);font-weight:600}
.week-body{display:none}.week-body.op{display:block}
.rp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px}
.rp-card{border-radius:var(--rl);padding:14px 16px;border:1px solid;box-shadow:var(--sh)}
.rp-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:var(--fh);margin:0 auto 8px}
.rp-nm{font-family:var(--fh);font-size:12px;font-weight:700;text-align:center;margin-bottom:2px}
.rp-rl{font-size:10px;color:var(--tx3);text-align:center;margin-bottom:10px}
.rp-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:4px 8px;background:var(--sf);border-radius:5px;border:1px solid var(--bd);margin-bottom:4px}
.rp-lbl{color:var(--tx3)}.rp-val{font-weight:700;font-family:var(--fh)}
.rp-tot{font-size:12px;font-weight:800;font-family:var(--fh);margin-top:8px;padding:7px;border-radius:6px;text-align:center}
.arch-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:12px;font-size:9px;font-weight:600;background:var(--archbg);color:var(--arch);border:1px solid var(--archbd)}
/* CIRCUIT STEPS */
.circuit{display:flex;align-items:center;gap:0;margin-bottom:16px;overflow-x:auto;padding:3px 0}
.cstep{display:flex;flex-direction:column;align-items:center;padding:8px 12px;border-radius:8px;font-size:10px;font-weight:600;border:2px solid;min-width:90px;text-align:center;flex-shrink:0}
.cstep-done{background:var(--gnbg);border-color:var(--gnbd);color:var(--gn)}
.cstep-active{background:#0A1628;border-color:var(--lcs);color:#fff}
.cstep-todo{background:var(--sf2);border-color:var(--bd);color:var(--tx3)}
.cstep-ko{background:var(--rdbg);border-color:var(--rdbd);color:var(--rd)}
.cstep-ic{font-size:16px;margin-bottom:3px}
.carr{color:var(--bd2);font-size:16px;margin:0 2px;flex-shrink:0;align-self:center}

@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}body>*{display:none!important}#print-area{display:block!important;margin:0;padding:0}@page{size:A4;margin:10mm 14mm}}

.pc-hd{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #2E8BC0;padding-bottom:12px;margin-bottom:16px}
.pc-logo{height:55px;width:auto}.pc-cn{font-family:'Syne',Arial,sans-serif}
.pc-cn-n{font-size:17px;font-weight:800;color:#0A1628;line-height:1.1}.pc-cn-s{font-size:9px;color:#8A98AA;text-transform:uppercase;letter-spacing:.9px;margin-top:2px}
.pc-ti-z{text-align:right}
.pc-doc{font-family:'Syne',Arial,sans-serif;font-size:20px;font-weight:800;color:#2E8BC0;text-transform:uppercase;letter-spacing:.8px;line-height:1}
.pc-num{font-size:13px;font-weight:700;color:#0A1628;margin-top:3px}.pc-dt{font-size:10px;color:#8A98AA;margin-top:2px}

.pc-ml{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;opacity:.8}
.pc-mv{font-family:'Syne',Arial,sans-serif;font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:3px}
.pc-mlt{font-size:10px;opacity:.7;margin-top:2px;font-style:italic}
.pc-rb{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:7px;padding:9px 13px;text-align:center}
.pc-rl{font-size:8px;text-transform:uppercase;letter-spacing:.6px;opacity:.65}.pc-rv{font-family:'Syne',Arial,sans-serif;font-size:15px;font-weight:700;margin-top:1px}
.pc-ig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.pc-ic{background:#F8FAFB;border:1px solid #D8DEE8;border-radius:7px;padding:10px 13px}
.pc-il{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#8A98AA;margin-bottom:4px}.pc-iv{font-size:12px;font-weight:600;color:#0F1928}.pc-is{font-size:10px;color:#8A98AA;margin-top:2px}
.pc-dt2{width:100%;border-collapse:collapse;margin-bottom:15px;font-size:11px}
.pc-dt2 th{background:#F0F4F8;padding:8px 11px;text-align:left;font-size:8px;text-transform:uppercase;letter-spacing:.6px;color:#3D4E63;font-weight:700;border:1px solid #D8DEE8}
.pc-dt2 td{padding:9px 11px;border:1px solid #D8DEE8;vertical-align:top}.pc-dt2 tr:nth-child(even) td{background:#FAFAFA}
.pc-lb{border:1px solid #D8DEE8;border-radius:7px;padding:10px 14px;margin-bottom:15px;background:#FAFAFA}
.pc-ll{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#8A98AA;margin-bottom:3px}
.pc-lv{font-size:12px;font-weight:600;font-style:italic;color:#0F1928;text-transform:capitalize}
.pc-sigs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;margin-top:8px}
.pc-sig{border:1px solid #D8DEE8;border-radius:7px;padding:12px 10px;text-align:center}
.pc-sr{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#8A98AA;margin-bottom:2px}.pc-sn{font-size:11px;font-weight:600;color:#0F1928;margin-bottom:1px}.pc-st{font-size:9px;color:#8A98AA;margin-bottom:12px}
.pc-sl{border-bottom:1.5px solid #0F1928;margin:0 7px 8px;height:36px;position:relative}
.pc-sl::after{content:'Signature';position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:8px;color:#C2CAD8;white-space:nowrap}
.pc-sdl{font-size:8px;color:#8A98AA;margin-top:15px}.pc-sdln{border-bottom:1px solid #D8DEE8;margin:3px 7px 0;height:14px}
.pc-sig-v{border-color:#A3D4B8;background:#F7FCF9}.pc-sig-v .pc-sr{color:#166834}
.pc-sig-d{border-color:#A5F3FC;background:#F0FEFF}.pc-sig-d .pc-sr{color:#0E7490}
.pc-sig-dm{border-color:#B5C8F5;background:#F5F8FE}.pc-sig-dm .pc-sr{color:#1547C8}
.pc-ft{border-top:2px solid #2E8BC0;padding-top:9px;margin-top:15px;display:flex;align-items:center;justify-content:space-between}
.pc-ft-t{font-size:8px;color:#8A98AA;line-height:1.6}
.pc-stamp{border:2px dashed #D8DEE8;border-radius:7px;width:80px;height:55px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#C2CAD8;text-align:center;line-height:1.4}
.pc-ft-lg{height:22px;width:auto;opacity:.45}

.nb-cl:hover{color:#fff;background:rgba(255,255,255,.1)}
.nb-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;padding:7px 11px;border-right:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:5px;flex-shrink:0}
.nb-cnt{background:var(--lcs);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px}
.nb-eff{font-size:9px;color:rgba(255,255,255,.3);padding:7px 11px;cursor:pointer;flex-shrink:0;margin-left:auto}
.nb-eff:hover{color:rgba(255,255,255,.7)}

.circuit{display:flex;align-items:center;gap:0;margin-bottom:14px;overflow-x:auto;padding:3px 0}
.cstep{display:flex;flex-direction:column;align-items:center;padding:7px 11px;border-radius:8px;font-size:10px;font-weight:600;border:2px solid;min-width:80px;text-align:center;flex-shrink:0}
.cs-ok{background:var(--gnbg);border-color:var(--gnbd);color:var(--gn)}
.cs-act{background:#0A1628;border-color:var(--lcs);color:#fff}
.cs-no{background:var(--sf2);border-color:var(--bd);color:var(--tx3)}
.cs-ko{background:var(--rdbg);border-color:var(--rdbd);color:var(--rd)}
.cic{font-size:15px;margin-bottom:3px}
.carr{color:var(--bd2);font-size:14px;margin:0 2px;flex-shrink:0;align-self:center}

function enL(n){
  const u2=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const d2=['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  function c(n){if(n===0)return'';if(n<20)return u2[n];const dz=Math.floor(n/10),un=n%10;
    if(dz===7)return'soixante-'+(un===0?'dix':un===1?'onze':u2[10+un]);
    if(dz===8)return un===0?'quatre-vingts':'quatre-vingt-'+u2[un];
    if(dz===9)return'quatre-vingt-'+(un===0?'dix':un===1?'onze':u2[10+un]);
    return d2[dz]+(un===1&&dz!==8?'-et-':un>0?'-':'')+u2[un]}
  if(n===0)return'zéro';let r='';
  const m=Math.floor(n/1e6),k=Math.floor((n%1e6)/1e3),rs=n%1e3;
  if(m>0)r+=(m===1?'un ':c(m)+' ')+'million'+(m>1?'s':'')+' ';
  if(k>0)r+=(k===1?'mille ':c(k)+' mille ');
  if(rs>0){const cc=Math.floor(rs/100),ut=rs%100;if(cc>0)r+=(cc===1?'cent':c(cc)+' cent')+(ut===0&&cc>1?'s':'')+' ';if(ut>0)r+=c(ut)}
  return r.trim()+' francs CFA';
}
function getWK(d){const dt=new Date(d+'T12:00:00'),dy=dt.getDay()||7;dt.setDate(dt.getDate()+4-dy);const y=dt.getFullYear(),w=Math.ceil(((dt-new Date(y,0,1))/86400000+1)/7);return`${y}-W${String(w).padStart(2,'0')}`}
function getWL(key){const[y,w]=key.split('-W');const j4=new Date(Number(y),0,4);const mn=new Date(j4.setDate(j4.getDate()-(j4.getDay()||7)+1+(parseInt(w)-1)*7));const sn=new Date(mn);sn.setDate(mn.getDate()+6);return`Sem. ${w} — ${fdS(mn.toISOString().slice(0,10))} au ${fdS(sn.toISOString().slice(0,10))}`}

function circuit(e){
  // Affiche le mini-circuit selon le statut
  const steps=[
    {ic:'📤',lb:'Soumis',st:['brouillon','envoyé_maite','attente_dg','valide','a_decaisser','decaisse','refuse']},
    {ic:'📝',lb:'Maïté →DG',st:['attente_dg','valide','a_decaisser','decaisse','refuse']},
    {ic:'✅',lb:'DG valide',st:['valide','a_decaisser','decaisse'],ko:['refuse']},
    {ic:'💸',lb:'Décaissé',st:['decaisse']},
  ];
  return`<div class="circuit">${steps.map((s,i)=>{
    let cls='cstep-todo';
    if(e.status==='refuse'&&s.ko&&i===2)cls='cstep-ko';
    else if(s.st.includes(e.status))cls='cstep-done';
    if((e.status==='envoyé_maite'&&i===0)||(e.status==='attente_dg'&&i===1)||(e.status==='valide'&&i===2)||(e.status==='a_decaisser'&&i===2)||(e.status==='refuse'&&i===2))cls='cstep-active';
    return(i>0?'<span class="carr">→</span>':'')+`<div class="cstep ${cls}"><div class="cstep-ic">${s.ic}</div><div>${s.lb}</div></div>`;
  }).join('')}</div>`;
}

            </tr>`).join('')}
          </table>
        </div>
      </div>
    </div>`;
  }).join('');
}

function printPiece(depId){
  const e=DATA.find(x=>x.id===depId);if(!e)return;

  gPrint({pn:e.pn||op?.pn||'LCS-PC-???',type:'SORTIE — DÉCAISSEMENT',mt:e.amount,lib:e.title,desc:e.desc,ref:e.ref,cat:e.cat,date:op?.date||e.date,

    dec:{nom:'Maïté Mengue',titre:'Assistante de Direction'},

}
function printPieceOp(oid){
  const op=CAISSE.ops.find(o=>o.id===oid);if(!op)return;

  gPrint({pn:op.pn,type:'ENTRÉE — APPROVISIONNEMENT',mt:op.mt,lib:op.lib,desc:op.note,ref:op.pn,cat:'Approvisionnement',date:op.date,

}

function renderNotifBar(){
  const mine = NOTIFS.filter(n => n.uid === CU.id && !n.read);
  const bar = document.getElementById('notif-bar');
  const inner = document.getElementById('nb-inner');
  if(!bar || !inner) return;
  if(!mine.length){ bar.className='notif-bar'; inner.innerHTML=''; return; }
  bar.className = 'notif-bar has';
  function getIc(msg){
    const icons=['🚨','⚠️','💸','✅','❌','📨','💰','🔵','🖨️','📥','ℹ️'];
    for(const ic of icons) if(msg.startsWith(ic)) return ic;
    return '🔔';
  }
  inner.innerHTML =
    `<div class="nb-lbl">🔔 <span class="nb-cnt">${mine.length}</span></div>` +
    mine.map(n =>
      `<div class="nb-item">
        <span class="nb-ic">${getIc(n.msg)}</span>
        <span class="nb-tx">${n.msg.split('\n').join(' — ')}</span>
        <span class="nb-tm">${n.time||''}</span>
        <span class="nb-cl" onclick="markReadById('${n.id}')">✕</span>
      </div>`
    ).join('') +
    `<div class="nb-eff" onclick="clearAllNotifs()">Tout effacer ✕</div>`;
}

function markReadById(nid){
  NOTIFS = NOTIFS.map(n => String(n.id)===String(nid) ? {...n, read:true} : n);
  renderNotifBar();
  autoSave();
}

function clearAllNotifs(){
  NOTIFS = NOTIFS.map(n => n.uid===CU.id ? {...n, read:true} : n);
  renderNotifBar();
  autoSave();
}

function markRead(depId){
  NOTIFS = NOTIFS.map(n => n.depId===depId ? {...n, read:true} : n);
  renderNotifBar();
}

    }
  });

  window.SYNC_OK = true;
  if(typeof afficherStatut === 'function') afficherStatut(true);
  if(typeof toast === 'function') toast('🔥 Connecté en temps réel','ok');
  console.log('🔥 Firebase Realtime Database connecté');

} catch(e) {
  console.warn('Firebase erreur:', e.message);
  if(typeof afficherStatut === 'function') afficherStatut(false);
}
</script>

</body>
</html>
